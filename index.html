<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-Month Calendar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calendar-app">
        <header class="app-header">
            <button id="btn-prev" class="nav-btn">&larr; 前の月</button>
            <div style="display: flex; align-items: center; gap: 1.5rem;">
                <h1 id="header-title" style="font-family: 'Outfit', sans-serif; font-size: 1.8rem; font-weight: 700; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></h1>
                <button id="btn-today" class="nav-btn today-btn">今日</button>
                <button id="btn-manage-templates" class="nav-btn">登録リスト編集</button>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <button id="btn-next" class="nav-btn">次の月 &rarr;</button>
                <div class="theme-switch-wrapper" title="ダークモード切替">
                    <label class="theme-switch" for="theme-toggle">
                        <input type="checkbox" id="theme-toggle">
                        <div class="slider round"></div>
                    </label>
                </div>
            </div>
        </header>
        
        <main class="calendars-container">
            <div class="calendar-wrapper">
                <h2 id="left-month-title" class="month-title">Month 1</h2>
                <div class="calendar" id="calendar-left"></div>
                <div id="memo-left" class="memo-container"></div>
            </div>
            <div class="calendar-wrapper">
                <h2 id="right-month-title" class="month-title">Month 2</h2>
                <div class="calendar" id="calendar-right"></div>
                <div id="memo-right" class="memo-container"></div>
            </div>
        </main>
    </div>

    <!-- Event Modal -->
    <div id="event-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-date-title">Date</h3>
                <button id="btn-close-modal" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <ul id="event-list" class="event-list"></ul>
                    <div class="date-icon-selection">
                        <h4>日付アイコン設定</h4>
                        <div style="display: flex; gap: 0.75rem; justify-content: space-around;">
                            <label style="cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.25rem;">
                                <input type="checkbox" name="date-icon-check" value="🏃">
                                <span style="font-size: 1.2rem;">🏃</span>
                            </label>
                            <label style="cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.25rem;">
                                <input type="checkbox" name="date-icon-check" value="💧">
                                <span style="font-size: 1.2rem;">💧</span>
                            </label>
                            <label style="cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.25rem;">
                                <input type="checkbox" name="date-icon-check" value="🦴">
                                <span style="font-size: 1.2rem;">🦴</span>
                            </label>
                            <label style="cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.25rem;">
                                <input type="checkbox" name="date-icon-check" value="💨">
                                <span style="font-size: 1.2rem;">💨</span>
                            </label>
                            <label style="cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.25rem;">
                                <input type="checkbox" name="date-icon-check" value="🎂">
                                <span style="font-size: 1.2rem;">🎂</span>
                            </label>
                            <label style="cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.25rem;">
                                <input type="checkbox" name="date-icon-check" value="📖">
                                <span style="font-size: 1.2rem;">📖</span>
                            </label>
                            <label style="cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.25rem;">
                                <input type="checkbox" name="date-icon-check" value="🔨">
                                <span style="font-size: 1.2rem;">🔨</span>
                            </label>
                            <label style="cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.25rem;">
                                <input type="checkbox" name="date-icon-check" value="🇺🇸">
                                <span style="font-size: 1.2rem;">🇺🇸</span>
                            </label>
                            <label style="cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.25rem;">
                                <input type="checkbox" name="date-icon-check" value="🏢">
                                <span style="font-size: 1.2rem;">🏢</span>
                            </label>
                        </div>
                    </div>

                    <div class="input-row">
                        <input type="color" id="new-event-color" value="#667eea" class="color-picker" title="背景色を選択">
                        <input type="color" id="new-event-text-color" value="#ffffff" class="color-picker" title="文字色を選択">
                        <input type="text" id="new-event-input" placeholder="新しい予定を入力..." autocomplete="off">
                    </div>
                    <button id="btn-add-event" class="primary-btn">追加</button>
                    
                    <div class="quick-add-templates">
                        <h4 class="quick-add-title">登録リストから追加</h4>
                        <div id="quick-template-container" class="template-chips"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Template Management Modal -->
    <div id="template-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>登録リスト管理</h3>
                <button id="btn-close-template-modal" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <ul id="template-list" class="event-list"></ul>
            </div>
        </div>
    </div>
    
    <!-- Custom Context Menu -->
    <div id="custom-context-menu" class="hidden">
        <ul>
            <li id="menu-edit">編集</li>
            <li id="menu-add-template">登録リストへ追加</li>
            <li id="menu-set-period">期間指定</li>
        </ul>
    </div>

    <!-- Period Specify Modal -->
    <div id="period-modal" class="modal hidden">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h3>期間指定パラメータ設定</h3>
                <button id="btn-close-period-modal" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="input-group-vertical">
                    <div style="display: flex; gap: 1rem;">
                        <div style="flex: 1;">
                            <label style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.25rem; display: block;">開始日</label>
                            <input type="date" id="period-start-date" class="template-select">
                        </div>
                        <div style="flex: 1;">
                            <label style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.25rem; display: block;">終了日</label>
                            <input type="date" id="period-end-date" class="template-select">
                        </div>
                    </div>
                    <button id="btn-apply-period" class="primary-btn" style="margin-top: 1rem;">適用</button>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
